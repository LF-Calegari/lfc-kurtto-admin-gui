services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      PORT: "${PORT:-3001}"
    networks:
      - default
    stdin_open: true
    tty: true
    command: npm start

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "${WEB_PORT:-8081}:80"
    networks:
      - default
    profiles:
      - production

networks:
  default:
    external: true
    name: ${EXTERNAL_NETWORK_NAME:-lfc_platform_network}
