services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      PORT: "3000"
    stdin_open: true
    tty: true
    command: npm start

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "${WEB_PORT:-8080}:80"
    profiles:
      - production
