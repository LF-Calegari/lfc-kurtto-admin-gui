name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - development

jobs:
  sonarqube:
    name: SonarCloud analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SonarCloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          set -eu
          missing=0
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error title=SonarCloud::Configure o secret SONAR_TOKEN em Settings → Secrets and variables → Actions (token de análise no SonarCloud)."
            missing=1
          fi
          if [ -z "$SONAR_ORGANIZATION" ]; then
            echo "::error title=SonarCloud::Configure a variable SONAR_ORGANIZATION em Settings → Secrets and variables → Actions → Variables (Organization key no SonarCloud)."
            missing=1
          fi
          if [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "::error title=SonarCloud::Configure a variable SONAR_PROJECT_KEY em Settings → Secrets and variables → Actions → Variables (Project key no SonarCloud)."
            missing=1
          fi
          exit "$missing"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests with coverage
        run: npm test -- --coverage --watchAll=false

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
