# Identificação de organização e projeto no SonarCloud é injetada no CI via
# GitHub Variables SONAR_ORGANIZATION e SONAR_PROJECT_KEY (ver README).

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/build/**,**/coverage/**
